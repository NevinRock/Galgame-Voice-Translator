[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame-voice-translator"
version = "0.1.0"
description = "Japanese-to-Mandarin voice translation pipeline for SiglusEngine games"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "msgpack>=1.0,<2",
  "requests>=2.31,<3",
]

[project.scripts]
galgame-voice = "galgame_voice.cli:main"

[tool.setuptools.packages.find]
include = ["galgame_voice*"]
